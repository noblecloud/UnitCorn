name: Release

# Publishes unitcorn to PyPI when a version tag is pushed
# (git tag v0.9.2 && git push origin v0.9.2).
# Uses PyPI trusted publishing: no token is stored in this repo. The project
# needs a trusted publisher configured on PyPI (owner noblecloud, repo
# noblecloud/UnitCorn, workflow release.yml, environment pypi).
# See docs/releasing.md.

on:
  push:
    tags: ["v*", "[0-9]*"]
  # Run from the Actions tab (or the API) on main to publish the version in
  # pyproject.toml without pushing a tag first; the last job then tags it.
  workflow_dispatch:

jobs:
  unitcorn:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pipx install poetry
      - run: poetry build -o dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  tag:
    needs: unitcorn
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the released version
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          git tag "v$version"
          git push origin "v$version"
